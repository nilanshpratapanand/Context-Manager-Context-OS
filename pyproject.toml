[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contextos"
version = "0.2.0"
description = "The state layer that makes trajectory-drop model handoffs work"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
exact-tokens = ["tiktoken>=0.5"]

[project.scripts]
contextos = "contextos.cli:main"
contextos-mcp = "contextos.mcp_server:main"

[tool.setuptools]
packages = ["contextos"]
